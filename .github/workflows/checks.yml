name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_LINK_MODE: copy
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        # Official action: https://github.com/astral-sh/setup-uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.19"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Test app and decision code
        run: uv run --locked pytest -q
      - name: Test deployment fixtures
        run: python3 -m unittest discover -s deploy/tests -p "test_*.py" -v
      - name: Validate Duo flows
        run: uv run --locked python flows/validate.py
      - name: Validate orders
        working-directory: relay
        run: uv run --locked --project .. python -m nightorders.cli validate ../ops/night-orders.yml --ops ../ops
      - name: Validate desired state
        working-directory: relay
        run: uv run --locked --project .. python -m nightorders.cli state ../ops/state.yml --ops ../ops
      - name: Replay demo night
        working-directory: relay
        run: uv run --locked --project .. python -m nightorders.demo_night ../demo/night-2026-10-20

  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        # Official action: https://github.com/astral-sh/setup-uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.19"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Install Chromium
        run: uv run --with playwright==1.62.0 python -m playwright install --with-deps chromium
      - name: Test phone and laptop flows
        run: uv run --with playwright==1.62.0 python scripts/browser_smoke.py

  cli-audit:
    name: Pinned gcloud flag audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Audit deployment command help
        # SDK 587.0.0 includes alpha and beta, matching the GitLab audit image.
        run: |
          docker run --rm --network none \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --workdir /workspace \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env CLOUDSDK_CORE_DISABLE_PROMPTS=1 \
            --env CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK=1 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:be4876b4311056bf3ce236a14a7dea1288e70b7cfea2454ea15e4165c819921f \
            python3 -m unittest -v deploy/tests/test_cli_flags.py
