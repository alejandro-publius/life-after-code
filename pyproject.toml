[project]
name = "night-orders"
version = "0.1.0"
description = "Before bed, the on-call engineer signs what the agent may do alone tonight. Everything else wakes her."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
agent = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["relay", "shop", "agent", "."]
