[project]
name = "night-orders"
version = "0.1.0"
description = "Before bed, the on-call engineer signs what the agent may do alone tonight. Everything else wakes her."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
agent = ["anthropic>=0.40"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["relay", "shop", "agent", "."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Errors and pyflakes: syntax errors, undefined names, unused imports and variables.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests import pytest fixtures from other test modules and take them as arguments, which pyflakes reads as a
# redefinition.
"tests/*" = ["F811"]
